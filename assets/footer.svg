<svg width="100%" height="100%" viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="footerText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="waveGradF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .quote-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
    }
    .sub-footer {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Top Accent Glowing Wave -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#footerBorder)" stroke-width="2" />

  <!-- Background Box -->
  <rect y="3" width="1200" height="117" rx="16" fill="url(#footerBg)" />

  <!-- Centered Footer Content -->
  <g transform="translate(600, 50)">
    <text text-anchor="middle" fill="url(#footerText)" class="quote-text">
      "Code with purpose • Build with passion • Ship with pride" 🚀
    </text>
    <text text-anchor="middle" y="32" fill="#94A3B8" class="sub-footer">
      Designed &amp; Maintained by Rajkumar P K • Thanks for visiting! ⭐
    </text>
  </g>
</svg>
