<svg width="100%" height="100%" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Text Linear Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Radial Gradients -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Bottom Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .name-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.8px;
    }
    .sub-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 0.2px;
    }
    .status-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <rect width="1200" height="360" rx="20" fill="url(#grid)" />

  <!-- Ambient Glow Spheres -->
  <rect width="1200" height="360" rx="20" fill="url(#glowCyan)" />
  <rect width="1200" height="360" rx="20" fill="url(#glowPurple)" />

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="1198" height="358" rx="19" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Terminal Top Bar Window Controls -->
  <g transform="translate(45, 38)">
    <circle cx="0" cy="0" r="6.5" fill="#EF4444" opacity="0.85" />
    <circle cx="20" cy="0" r="6.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="40" cy="0" r="6.5" fill="#10B981" opacity="0.85" />
    <text x="65" y="4.5" fill="#64748B" font-family="monospace" font-size="12" font-weight="600">rajkumar@portfolio:~</text>
  </g>

  <!-- Status Indicator Badge (Top Right) -->
  <g transform="translate(930, 32)">
    <rect width="225" height="28" rx="14" fill="#032b1a" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10B981" />
    <circle cx="16" cy="14" r="7.5" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="32" y="18" fill="#34D399" class="status-text">OPEN FOR WORK &amp; COLLAB</text>
  </g>

  <!-- Main Hero Content (Centered) -->
  <g transform="translate(600, 150)">
    <!-- Decorative Code Tags -->
    <text x="-340" y="-12" fill="#38BDF8" font-family="monospace" font-size="28" font-weight="700" opacity="0.4">&lt;dev&gt;</text>
    <text x="240" y="-12" fill="#C084FC" font-family="monospace" font-size="28" font-weight="700" opacity="0.4">&lt;/dev&gt;</text>

    <!-- Main Title -->
    <text text-anchor="middle" y="5" fill="url(#titleGrad)" class="name-title">RAJKUMAR P K</text>

    <!-- Subtitle Line -->
    <text text-anchor="middle" y="46" fill="url(#subGrad)" class="sub-text">
      Computer Science Engineering @ VIT Chennai • Full-Stack &amp; AI Systems Developer
    </text>

    <!-- Skill Tags / Badges Row -->
    <g transform="translate(0, 92)">
      <!-- Badge 1: Full-Stack Web -->
      <g transform="translate(-360, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
        <text text-anchor="middle" x="82" y="21" fill="#7DD3FC" class="badge-text">⚡ FULL-STACK WEB</text>
      </g>

      <!-- Badge 2: AI & RAG Agents -->
      <g transform="translate(-175, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#818CF8" stroke-width="1" stroke-opacity="0.6" />
        <text text-anchor="middle" x="82" y="21" fill="#A5B4FC" class="badge-text">🤖 AI &amp; RAG AGENTS</text>
      </g>

      <!-- Badge 3: ML Cybersecurity -->
      <g transform="translate(10, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#C084FC" stroke-width="1" stroke-opacity="0.6" />
        <text text-anchor="middle" x="82" y="21" fill="#E9D5FF" class="badge-text">🛡️ ML SECURITY</text>
      </g>

      <!-- Badge 4: React & Node.js -->
      <g transform="translate(195, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#34D399" stroke-width="1" stroke-opacity="0.6" />
        <text text-anchor="middle" x="82" y="21" fill="#6EE7B7" class="badge-text">⚛️ REACT &amp; NODE</text>
      </g>
    </g>
  </g>

  <!-- Glowing Bottom Accent Line / Wave -->
  <path d="M 0 350 Q 300 338, 600 350 T 1200 350 L 1200 360 L 0 360 Z" fill="url(#waveGrad)" opacity="0.8" />
  <line x1="0" y1="350" x2="1200" y2="350" stroke="url(#waveGrad)" stroke-width="2.5" />
</svg>
